name: Market Fundamental Analysis

on:
  schedule:
    # Times are in UTC. GitHub Actions cron does not observe daylight saving,
    # so these will drift by 1 hour relative to London/NY local time for part
    # of the year — nudge them by an hour around late March / late October
    # if you want them pinned exactly.
    - cron: "0 6 * * 1-5"   # ~before London session, weekdays
    - cron: "0 12 * * 1-5"  # ~before New York session, weekdays
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine session from trigger time
        id: session
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -lt 9 ]; then
            echo "session=london" >> "$GITHUB_OUTPUT"
          else
            echo "session=newyork" >> "$GITHUB_OUTPUT"
          fi

      - name: Run analysis and push to site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MARKET_WRITE_SECRET: ${{ secrets.MARKET_WRITE_SECRET }}
        run: node scripts/run-analysis.js ${{ steps.session.outputs.session }}
